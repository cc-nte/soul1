1:rgba(139,92,246,.16);--g2:rgba(59,130,246,.16);--grid:rgba(0,0,0,.045)}\n\nbody{font-family:var(--sans)!important;-webkit-font-smoothing:antialiased}\n.page-bg{position:relative;background:radial-gradient(60vw 60vw at 20% -10%,var(--g1),transparent 70%),radial-gradient(50vw 50vw at 80% 110%,var(--g2),transparent 70%),var(--bg)!important;color:var(--fg)!important}\n.page-bg::before{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:4rem 4rem;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 60%,transparent 100%)}\n.page-bg::after{content:\"\";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><\/filter><rect width='100%25' height='100%25' filter='url(%23n)'/><\/svg>\")}\n\n/* вращающиеся кольца */\n.soul-rings{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0;overflow:hidden}\n.soul-rings i{position:absolute;border-radius:50%;border:1px solid var(--line)}\n.soul-rings i:nth-child(1){width:min(130vw,820px);aspect-ratio:1;border-style:dashed;animation:spin 70s linear infinite}\n.soul-rings i:nth-child(2){width:min(100vw,620px);aspect-ratio:1;animation:spin 90s linear infinite reverse}\n.soul-rings i:nth-child(2)::after{content:\"\";position:absolute;left:0;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--fg);box-shadow:0 0 16px var(--fg)}\n.soul-rings i:nth-child(3){width:min(170vw,1100px);aspect-ratio:1;border-style:dotted;opacity:.6;animation:spin 120s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n\n/* панель */\n@keyframes panelEnter{from{opacity:0;transform:translateY(28px);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}\nmain{position:relative;z-index:1;max-width:46rem!important;border-radius:22px!important;background:var(--glass)!important;border:1px solid var(--line)!important;box-shadow:0 40px 120px -30px rgba(0,0,0,.55)!important}\nmain.panel-enter{transform:none}\nmain footer{font-family:var(--mono);font-size:10px!important;letter-spacing:.06em;border-color:var(--line)!important}\n\n/* типографика */\n.soul-title{font-family:var(--serif)!important;font-style:italic;font-weight:500!important;font-size:32px!important;line-height:1;letter-spacing:-.02em}\nmain h2{font-family:var(--mono);font-weight:400!important;font-size:11px!important;letter-spacing:.08em;color:var(--mute)!important}\n.text-neutral-200{color:var(--fg)!important}\n.text-neutral-400,.text-neutral-500{color:var(--mute)!important}\n#home-user-handle,.badge-chip,.contact-action{font-family:var(--mono)!important;letter-spacing:.08em}\n.badge-chip{display:inline-flex;align-items:center;gap:7px;background:transparent!important;border:1px solid var(--line)!important;color:var(--mute)!important;backdrop-filter:blur(8px)}\n.badge-chip::before{content:\"\";width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:ping 2s infinite}\n@keyframes ping{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}\n\n/* аватары — монохром + курсивная буква */\n.avatar-dynamic,.chat-avatar,.contact-avatar{background:var(--fg)!important;background-image:none!important;border-color:transparent!important}\n.avatar-letter{color:var(--bg)!important;font-family:var(--serif)!important;font-style:italic;font-weight:600!important}\n\n/* карточки */\n.favorite-cloud,.profile-cloud,.settings-cloud,.settings-card,.contact-cloud{background:transparent!important;background-image:none!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:none!important;transform:none!important}\n.favorite-cloud:hover,.profile-cloud:hover,.settings-card:hover{border-color:color-mix(in srgb,var(--fg) 40%,transparent)!important;transform:none!important;box-shadow:none!important}\n.contact-item{background:transparent!important;border-color:transparent!important;border-radius:12px!important}\n.contact-item:hover{transform:none!important;box-shadow:none!important;border-color:var(--line)!important}\n.contact-item:hover .contact-action{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}\n.contact-action{background:transparent!important}\n.search-input,.profile-panel-glass input{background:transparent!important;border:1px solid var(--line)!important;border-radius:12px!important;color:var(--fg)}\n\n/* кнопки справа */\n.neon-button{background:transparent!important;border:1px solid var(--line)!important;box-shadow:none!important;color:var(--fg)!important;backdrop-filter:blur(10px)}\n.neon-button:hover{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}\n\n/* чат */\n.chat-messages-area{background:transparent!important;border:1px solid var(--line);border-radius:14px!important}\n.bubble{font-size:14px!important}\n.bubble-incoming{background:transparent!important;border:1px solid var(--line);color:var(--fg)!important}\n.bubble-outgoing{background:var(--fg)!important;color:var(--bg)!important}\n.chat-input-wrap{background:transparent!important;border:1px solid var(--line)!important;border-radius:999px!important}\n.chat-send-btn{background:var(--fg)!important;color:var(--bg)!important;border:none!important}\n.chat-send-btn:hover{box-shadow:none!important;transform:scale(1.1)}\n.back-link{color:var(--mute)}\n\n/* курсор */\n.soul-cursor{position:fixed;top:0;left:0;width:16px;height:16px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:9999;will-change:transform}\nhtml.soul-cursor-on,html.soul-cursor-on a,html.soul-cursor-on button,html.soul-cursor-on .contact-item{cursor:none!important}\n:focus-visible{outline:2px solid var(--fg);outline-offset:3px}\n@media (prefers-reduced-motion:reduce){.soul-rings i,.badge-chip::before{animation:none}.soul-cursor{display:none}}\n\n/* ===== варианты для сравнения ===== */\n.soul-mark{display:none}\n\n/* A — крупное слово страницы за стеклом: главная точка притяжения */\nhtml.v-hero .soul-mark,html.v-mark .soul-mark{display:block;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;white-space:nowrap;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(7rem,24vw,22rem);line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--fg) 26%,transparent);animation:markIn 1.3s var(--ease) both}\n@keyframes markIn{from{opacity:0;transform:translate(-50%,-45%) scale(1.04);filter:blur(14px)}to{opacity:1;transform:translate(-50%,-50%);filter:none}}\nhtml.v-hero main{background:color-mix(in srgb,var(--bg) 36%,transparent)!important;backdrop-filter:blur(16px) saturate(140%)}\nhtml.v-hero .soul-rings{opacity:.45}\n\n/* B — свет и глубина: блик следует за курсором, рамка-градиент */\nhtml.v-light main{background:radial-gradient(520px circle at var(--mx,50%) var(--my,-20%),color-mix(in srgb,var(--fg) 8%,transparent),transparent 60%),var(--glass)!important;border-color:transparent!important;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 14%,transparent),0 50px 140px -30px rgba(0,0,0,.7)!important}\nhtml.v-light main::before{content:\"\";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(155deg,color-mix(in srgb,var(--fg) 40%,transparent),color-mix(in srgb,var(--fg) 4%,transparent) 40%,color-mix(in srgb,var(--fg) 16%,transparent));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}\nhtml.v-light .favorite-cloud,html.v-light .profile-cloud,html.v-light .settings-card,html.v-light .contact-item{background-image:radial-gradient(240px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--fg) 11%,transparent),transparent 70%)!important}\nhtml.v-light .avatar-dynamic,html.v-light .chat-avatar,html.v-light .contact-avatar{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 34px -8px color-mix(in srgb,var(--fg) 45%,transparent)}\n\n/* C — один цвет: перелив для аватара, сообщений, наведения */\nhtml.v-accent{--ac1:#7b8cff;--ac2:#d36bff;--g1:rgba(99,102,241,.42);--g2:rgba(217,70,239,.30)}\nhtml.v-accent.theme-light{--g1:rgba(99,102,241,.26);--g2:rgba(217,70,239,.18)}\nhtml.v-accent .avatar-dynamic,html.v-accent .chat-avatar,html.v-accent .contact-avatar{background:linear-gradient(135deg,var(--ac1),var(--ac2))!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac1) 18%,transparent),0 10px 40px -6px color-mix(in srgb,var(--ac2) 70%,transparent)}\nhtml.v-accent .avatar-letter{color:#fff!important}\nhtml.v-accent .bubble-outgoing,html.v-accent .chat-send-btn,html.v-accent .contact-item:hover .contact-action,html.v-accent .neon-button:hover{background:linear-gradient(135deg,var(--ac1),var(--ac2))!important;color:#fff!important;border-color:transparent!important}\nhtml.v-accent .favorite-cloud:hover,html.v-accent .profile-cloud:hover,html.v-accent .settings-card:hover{border-color:var(--ac1)!important}\nhtml.v-accent .soul-rings i:nth-child(2)::after{background:var(--ac2);box-shadow:0 0 18px var(--ac2)}\n\n/* ===== B+ : общий штрих и надстройки поверх «свет» ===== */\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\nhtml.v-light main>:not(aside){animation:rise .9s var(--ease) both}\nhtml.v-light main>:nth-child(2){animation-delay:.08s}html.v-light main>:nth-child(3){animation-delay:.16s}html.v-light main>:nth-child(4){animation-delay:.24s}html.v-light main>:nth-child(5){animation-delay:.32s}html.v-light main>:nth-child(6){animation-delay:.4s}\n\n/* аврора: два медленных цветных облака */\nhtml.v-aurora .soul-rings::before,html.v-aurora .soul-rings::after{content:\"\";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.5;mix-blend-mode:screen}\nhtml.v-aurora .soul-rings::before{background:radial-gradient(circle,#6d4aff,transparent 65%);left:-15vmax;top:-20vmax;animation:drift1 26s ease-in-out infinite alternate}\nhtml.v-aurora .soul-rings::after{background:radial-gradient(circle,#ff4d8d,transparent 65%);right:-20vmax;bottom:-25vmax;animation:drift2 32s ease-in-out infinite alternate}\nhtml.theme-light.v-aurora .soul-rings::before,html.theme-light.v-aurora .soul-rings::after{mix-blend-mode:multiply;opacity:.3}\n@keyframes drift1{to{transform:translate(30vmax,18vmax) scale(1.2)}}\n@keyframes drift2{to{transform:translate(-28vmax,-14vmax) scale(.9)}}\n\n/* стекло: прозрачнее, мягче, крупнее скругления */\nhtml.v-glass{--glass:color-mix(in srgb,var(--fg) 5%,transparent);--g1:rgba(124,58,237,.5);--g2:rgba(14,165,233,.4)}\nhtml.v-glass.theme-light{--g1:rgba(139,92,246,.3);--g2:rgba(14,165,233,.25)}\nhtml.v-glass main{border-radius:30px!important;backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%)}\nhtml.v-glass .favorite-cloud,html.v-glass .profile-cloud,html.v-glass .settings-card,html.v-glass .contact-cloud{border-radius:22px!important;background-color:color-mix(in srgb,var(--fg) 5%,transparent)!important;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 14%,transparent)!important}\n\n/* хром: металлический блик в заголовке и аватаре */\nhtml.v-chrome .soul-title{font-size:44px!important;background:linear-gradient(100deg,var(--fg) 38%,color-mix(in srgb,var(--fg) 28%,transparent) 50%,var(--fg) 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent ra .soul-rings::after{mix-blend-mode:multiply;opacity:.3}\n@keyframes drift1{to{transform:translate(30vmax,18vmax) scale(1.2)}}\n@keyframes drift2{to{transform:translate(-28vmax,-14vmax) scale(.9)}}\n\n/* стекло: прозрачнее, мягче, крупнее скругления */\nhtml.v-glass{--glass:color-mix(in srgb,var(--fg) 5%,transparent);--g1:rgba(124,58,237,.5);--g2:rgba(14,165,233,.4)}\nhtml.v-glass.theme-light{--g1:rgba(139,92,246,.3);--g2:rgba(14,165,233,.25)}\nhtml.v-glass main{border-radius:30px!important;backdrop-filter:blur(34px) saturate(170%);-webkit-backdrop-filter:blur(34px) saturate(170%)}\nhtml.v-glass .favorite-cloud,html.v-glass .profile-cloud,html.v-glass .settings-card,html.v-glass .contact-cloud{border-radius:22px!important;background-color:color-mix(in srgb,var(--fg) 5%,transparent)!important;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 14%,transparent)!important}\n\n/* хром: металлический блик в заголовке и аватаре */\nhtml.v-chrome .soul-title{font-size:44px!important;background:linear-gradient(100deg,var(--fg) 38%,color-mix(in srgb,var(--fg) 28%,transparent) 50%,var(--fg) 62%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;animation:sheen 7s ease-in-out infinite}\n@keyframes sheen{from{background-position:100% 0}to{background-position:-100% 0}}\nhtml.v-chrome .avatar-dynamic,html.v-chrome .chat-avatar,html.v-chrome .contact-avatar{background:conic-gradient(from 200deg,#fff,#8a8a92,#f4f4f5,#6b6b74,#fff)!important}\nhtml.v-chrome .avatar-letter{color:#0a0a0a!important}\n\n/* кольцо: световая дуга бежит по рамке панели */\n@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}\nhtml.v-ring main::before{padding:1.5px;background:conic-gradient(from var(--a),transparent 0 60%,#7b8cff 80%,#ff7ad9 92%,transparent 100%);animation:turn 7s linear infinite}\n@keyframes turn{to{--a:360deg}}\nhtml.v-ring main{border-color:var(--line)!important;box-shadow:0 0 100px -3 ty:1}18%{transform:translate(40vw,19vw) rotate(25deg);opacity:0}100%{opacity:0}}\n@keyframes glow{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}\n@media (prefers-reduced-motion:reduce){.soul-amb .p,.soul-rings::before,.soul-rings::after{animation:none!important}}\n\n/* 1. ЯПОНИЯ — тушь, красное солнце, волны сейгайха, лепестки, ханко */\nhtml.v-st.v-sakura{--bg:#0e0f1a;--fg:#f3ece4;--mute:#9a96a8;--line:rgba(243,236,228,.14);--glass:rgba(14,15,26,.5);--g1:rgba(215,38,61,.22);--g2:rgba(255,183,197,.12);--sg:radial-gradient(circle at 50% 100%,transparent 36%,rgba(243,236,228,.11) 37% 39%,transparent 40% 52%,rgba(243,236,228,.11) 53% 55%,transparent 56% 68%,rgba(243,236,228,.11) 69% 71%,transparent 72%)\n & .page-bg{background:radial-gradient(circle at 84% 22%,#d7263d 0 90px,transparent 91px),radial-gradient(40vmin 40vmin at 84% 22%,rgba(215,38,61,.35),transparent 70%),radial-gradient(60vw 50vw at 10% 0,var(--g2),transparent 70%),var(--bg)!important}\n & .soul-rings i{display:none}\n & .soul-rings::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:28vh;background:var(--sg) 0 0/72px 36px,var(--sg) 36px 18px/72px 36px;-webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent)}\n & main{border-radius:6px!important}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:#d7263d!important;border-radius:10px!important;box-shadow:0 0 0 3px rgba(215,38,61,.2)}\n & .avatar-letter{color:#fff!important}\n & .bubble-outgoing,& .chat-send-btn{background:#d7263d!important;color:#fff!important}\n & .soul-mark{display:block;position:fixed;right:4vw;left:auto;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:'Noto Serif JP',serif;font-style:normal;font-weight:700;font-size:clamp(5rem,16vw,15rem);line-height:1;letter-spacing:0;color:transparent;-webkit-text-stroke:1px rgba(243,236,228,.32);pointer-events:none;z-index:0}\n & .p{background:#ffb7c5;border-radius:100% 0 100% 0;height:calc(var(--s)*.7);opacity:.85}}\n\n/* 2. WINTER ARC — сталь, лёд, снег, ничего лишнего */\nhtml.v-st.v-winter{--bg:#060a12;--fg:#e6f1ff;--mute:#7f93ad;--line:rgba(190,225,255,.16);--glass:rgba(10,18,32,.5);--g1:rgba(70,140,220,.28);--g2:rgba(150,210,255,.16);--grid:rgba(180,220,255,.05);--serif:'Inter Tight',sans-serif\n & .page-bg{background:radial-gradient(70vw 40vw at 50% -10%,var(--g1),transparent 70%),linear-gradient(to top,rgba(170,215,255,.15),transparent 32%),var(--bg)!important}\n & .soul-rings::before{content:\"\";position:absolute;inset:0;box-shadow:inset 0 0 160px 20px rgba(160,210,255,.14)}\n & .soul-title{font-family:var(--sans)!important;font-style:normal;font-weight:600!important;letter-spacing:-.04em;font-size:30px!important}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:linear-gradient(160deg,#fff,#9ad7ff)!important}\n & .avatar-letter{color:#06101e!important;font-style:normal}\n & .bubble-outgoing,& .chat-send-btn{background:#cfe8ff!important;color:#06101e!important}\n & .p{background:#fff;border-radius:50%;opacity:.8;filter:blur(.4px)}}\n\n/* 3. COZY — лампа, гирлянда, угольки, мягкие формы */\nhtml.v-st.v-cozy{--bg:#1a120d;--fg:#f7e8d3;--mute:#b39a80;--line:rgba(255,200,140,.2);--glass:rgba(44,28,18,.5);--g1:rgba(255,160,70,.3);--g2:rgba(200,90,50,.22);--sans:'Nunito',system-ui,sans-serif;--serif:'Lora',Georgia,serif\n & .page-bg{background:radial-gradient(50vw 50vw at 15% 105%,rgba(255,150,60,.38),transparent 65%),radial-gradient(45vw 40vw at 90% 0,rgba(255,190,110,.18),transparent 65%),var(--bg)!important}\n & .page-bg::before,& .soul-rings i{display:none}\n & .soul-rings::before,& .soul-rings::after{content:\"\";position:absolute;left:0;right:0;top:0;height:22px;background:radial-gradient(circle,#ffd27a 0 2.5px,rgba(255,210,122,.35) 3px 7px,transparent 8px) 0 6px/44px 22px repeat-x;animation:glow 2.6s ease-in-out infinite}\n & .soul-rings::after{background-position:22px 6px;animation-delay:1.3s}\n & main{border-radius:34px!important}\n & .favorite-cloud,& .profile-cloud,& .settings-card,& .contact-cloud{border-radius:24px!important}\n & .soul-title{font-size:30px!important}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:linear-gradient(135deg,#ffcf8a,#e8863a)!important;box-shadow:0 0 28px rgba(255,160,70,.45)}\n & .avatar-letter{color:#2a160a!important}\n & .bubble-outgoing,& .chat-send-btn{background:#e8863a!important;color:#1a0f08!important}\n & .p{background:#ffb15c;border-radius:50%;box-shadow:0 0 8px 2px rgba(255,160,70,.7);opacity:.8}}\n\n/* 4. AERO (Y2K) — небо, глянец, пузыри */\nhtml.v-st.v-aero{--bg:#bfe9ff;--fg:#0b3a5b;--mute:#4d7f9e;--line:rgba(255,255,255,.8);--glass:rgba(255,255,255,.42);--sans:'Nunito',system-ui,sans-serif;--serif:'Nunito',sans-serif\n & .page-bg{background:linear-gradient(180deg,#3bb6f5 0%,#bdeaff 55%,#c9f5d2 100%)!important}\n & .page-bg::before,& .page-bg::after,& .soul-rings i{display:none}\n & main{background:rgba(255,255,255,.4)!important;border-radius:34px!important;box-shadow:0 30px 70px -20px rgba(10,90,150,.45),inset 0 2px 0 rgba(255,255,255,.9)!important}\n & .soul-title{font-family:var(--sans)!important;font-style:normal;font-weight:800!important;font-size:30px!important;text-shadow:0 2px 0 rgba(255,255,255,.7)}\n & .favorite-cloud,& .profile-cloud,& .settings-card,& .contact-cloud{background-color:rgba(255,255,255,.5)!important;border:1px solid #fff!important;border-radius:22px!important}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:radial-gradient(circle at 30% 25%,#fff 0 12%,#7fe0ff 30%,#1a8fe0 75%)!important;box-shadow:inset 0 -6px 10px rgba(0,60,140,.4),0 6px 16px rgba(0,100,200,.35)}\n & .avatar-letter{color:#fff!important;font-style:normal;text-shadow:0 1px 3px rgba(0,60,140,.6)}\n & .bubble-outgoing,& .chat-send-btn{background:linear-gradient(180deg,#6fd0ff,#1c8ee8)!important;color:#fff!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.6)}\n & .bubble-incoming{background:rgba(255,255,255,.7)!important;border-color:#fff!important}\n & .p{border-radius:50%;border:1px solid rgba(255,255,255,.9);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.9) 0 12%,rgba(255,255,255,.15) 45%,rgba(255,255,255,.05))}}\n\n/* 5. SYNTH — неоновое солнце, сетка до горизонта */\nhtml.v-st.v-synth{--bg:#0d0221;--fg:#f4e9ff;--mute:#a58ac8;--line:rgba(255,41,117,.35);--glass:rgba(20,5,45,.55);--g1:rgba(255,41,117,.3);--g2:rgba(0,229,255,.2);--sans:'Exo 2',system-ui,sans-serif;--serif:'Exo 2',sans-serif\n & .page-bg{background:linear-gradient(180deg,#0d0221 0%,#2a0a55 58%,#ff2975 100%)!important}\n & .soul-rings i{display:none}\n & .soul-rings::before{content:\"\";position:absolute;left:50%;bottom:34vh;width:44vmin;height:44vmin;margin-left:-22vmin;border-radius:50%;background:linear-gradient(180deg,#ffe14d,#ff2975);-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 11px,transparent 11px 14px);mask-image:repeating-linear-gradient(180deg,#000 0 11px,transparent 11px 14px);filter:drop-shadow(0 0 30px rgba(255,41,117,.7))}\n & .page-bg::before{inset:auto -40% 0 -40%;height:36vh;transform-origin:50% 0;transform:perspective(260px) rotateX(58deg);background-color:#14022c;background-image:linear-gradient(to right,rgba(255,41,117,.75) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,41,117,.75) 1px,transparent 1px);background-size:60px 40px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%);mask-image:linear-gradient(to bottom,transparent,#000 40%)}\n & main{border-radius:4px!important;border:1px solid #ff2975!important;box-shadow:0 0 50px rgba(255,41,117,.35),inset 0 0 30px rgba(255,41,117,.1)!important}\n & main::before{background:linear-gradient(135deg,#ff2975,transparent 40%,#00e5ff)}\n & .soul-title{font-style:italic;font-weight:700!important;font-size:30px!important;text-shadow:0 0 18px #ff2975,0 0 2px #fff}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:linear-gradient(135deg,#00e5ff,#ff2975)!important;box-shadow:0 0 24px rgba(255,41,117,.6)}\n & .avatar-letter{color:#0d0221!important}\n & .bubble-outgoing,& .chat-send-btn{background:linear-gradient(135deg,#ff2975,#8b2fff)!important;color:#fff!important;box-shadow:0 0 18px rgba(255,41,117,.5)}\n & .bubble-incoming{border-color:#00e5ff!important}}\n\n/* 6. TERMINAL — зелёный CRT, строки кода */\nhtml.v-st.v-terminal{--bg:#020a05;--fg:#6dff9b;--mute:#2f9a55;--line:rgba(109,255,155,.3);--glass:rgba(2,12,6,.7);--g1:rgba(0,255,120,.12);--g2:rgba(0,180,90,.1);--sans:'JetBrains Mono',monospace;--serif:'JetBrains Mono',monospace\n & *:not(.soul-cursor){border-radius:0!important}\n & body{text-shadow:0 0 6px rgba(109,255,155,.45)}\n & .soul-rings i{display:none}\n & .page-bg::after{opacity:1;mix-blend-mode:normal;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}\n & .soul-rings::before{content:\"\";position:absolute;inset:0;box-shadow:inset 0 0 200px rgba(0,0,0,.85)}\n & .soul-title{font-style:normal;font-weight:500!important;font-size:24px!important;letter-spacing:0}\n & .soul-title::before{content:\"> \"}\n & .soul-title::after{content:\"_\";animation:blink 1s steps(1) infinite}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:transparent!important;border:1px solid var(--fg)!important}\n & .avatar-letter{color:var(--fg)!important;font-style:normal}\n & .bubble-outgoing,& .chat-send-btn{background:var(--fg)!important;color:#020a05!important}\n & .p{color:#6dff9b;opacity:.35;text-shadow:0 0 6px #6dff9b}}\n\n/* 7. BRUTAL — жёлтый, чёрные рамки, жёсткие тени */\nhtml.v-st.v-brutal{--bg:#ffd84d;--fg:#0a0a0a;--mute:#444;--line:#0a0a0a;--glass:#fff;--g1:transparent;--g2:transparent;--sans:'Rubik',system-ui,sans-serif;--serif:'Rubik',sans-serif\n & .page-bg{background:#ffd84d!important}\n & .page-bg::before{background-image:radial-gradient(#0a0a0a 1.2px,transparent 1.4px);background-size:22px 22px;opacity:.22;-webkit-mask-image:none;mask-image:none}\n & .page-bg::after,& .soul-rings i,& main::before{display:none}\n & main{background:#fff!important;border:3px solid #0a0a0a!important;border-radius:14px!important;box-shadow:10px 10px 0 #0a0a0a!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}\n & .soul-title{font-style:normal;font-weight:800!important;font-size:30px!important;letter-spacing:-.03em}\n & .favorite-cloud,& .profile-cloud,& .settings-card,& .contact-cloud{background:#fff!important;background-image:none!important;border:2.5px solid #0a0a0a!important;border-radius:10px!important;box-shadow:4px 4px 0 #0a0a0a!important}\n & .favorite-cloud:hover,& .profile-cloud:hover,& .settings-card:hover{transform:translate(-2px,-2px)!important;box-shadow:6px 6px 0 #0a0a0a!important;border-color:#0a0a0a!important}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:#ff6bd6!important;border:2.5px solid #0a0a0a!important}\n & .avatar-letter{color:#0a0a0a!important;font-style:normal;font-weight:800!important}\n & .bubble-outgoing{background:#7cf29a!important;color:#0a0a0a!important;border:2px solid #0a0a0a}\n & .bubble-incoming{background:#fff!important;border:2px solid #0a0a0a}\n & .chat-send-btn,& .neon-button:hover{background:#ff6bd6!important;color:#0a0a0a!important;border:2.5px solid #0a0a0a!important}\n & .neon-button,& .chat-input-wrap,& .search-input,& .chat-messages-area{background:#fff!important;border:2.5px solid #0a0a0a!important}\n & .p{border:3px solid #0a0a0a;opacity:1}\n & .p:nth-child(4n+1){border-radius:50%;background:#ff6bd6}\n & .p:nth-child(4n+2){background:#6be3ff}\n & .p:nth-child(4n+3){background:#7cf29a;border-radius:30%}\n & .p:nth-child(4n){background:#fff;border-radius:50% 0}}\n\n/* 8. КОСМОС — звёзды, планета с кольцом, падающие звёзды */\nhtml.v-st.v-space{--bg:#04020d;--fg:#ece8ff;--mute:#8d86b8;--line:rgba(190,170,255,.18);--glass:rgba(8,5,24,.5);--g1:rgba(80,60,200,.3);--g2:rgba(180,60,200,.18)\n & .soul-rings::before{content:\"\";position:absolute;left:-8vmin;bottom:-12vmin;width:42vmin;height:4 ud{background:#fff!important;background-image:none!important;border:2.5px solid #0a0a0a!important;border-radius:10px!important;box-shadow:4px 4px 0 #0a0a0a!important}\n & .favorite-cloud:hover,& .profile-cloud:hover,& .settings-card:hover{transform:translate(-2px,-2px)!important;box-shadow:6px 6px 0 #0a0a0a!important;border-color:#0a0a0a!important}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:#ff6bd6!important;border:2.5px solid #0a0a0a!important}\n & .avatar-letter{color:#0a0a0a!important;font-style:normal;font-weight:800!important}\n & .bubble-outgoing{background:#7cf29a!important;color:#0a0a0a!important;border:2px solid #0a0a0a}\n & .bubble-incoming{background:#fff!important;border:2px solid #0a0a0a}\n & .chat-send-btn,& .neon-button:hover{background:#ff6bd6!important;color:#0a0a0a!important;border:2.5px solid #0a0a0a!important}\n & .neon-button,& .chat-input-wrap,& .search-input,& .chat-messages-area{background:#fff!important;border:2.5px solid #0a0a0a!important}\n & .p{border:3px solid #0a0a0a;opacity:1}\n & .p:nth-child(4n+1){border-radius:50%;background:#ff6bd6}\n & .p:nth-child(4n+2){background:#6be3ff}\n & .p:nth-child(4n+3){background:#7cf29a;border-radius:30%}\n & .p:nth-child(4n){background:#fff;border-radius:50% 0}}\n\n/* 8. КОСМОС — звёзды, планета с кольцом, падающие звёзды */\nhtml.v-st.v-space{--bg:#04020d;--fg:#ece8ff;--mute:#8d86b8;--line:rgba(190,170,255,.18);--glass:rgba(8,5,24,.5);--g1:rgba(80,60,200,.3);--g2:rgba(180,60,200,.18)\n & .soul-rings::before{content:\"\";position:absolute;left:-8vmin;bottom:-12vmin;width:42vmin;height:42vmin;border-radius:50%;background:radial-gradient(circle at 30% 28%,#9a86ff,#4a2fb8 45%,#150a45 80%);box-shadow:inset -3vmin -3vmin 6vmin rgba(0,0,0,.65),0 0 8vmin rgba(120,90,255,.35)}\n & .soul-rings::after{content:\"\";position:absolute;left:-14vmin;bottom:-1vmin;width:54vmin;height:12vmin;border-radius:50%;border:2px solid rgba(190,170,255,.45);transform:rotate(-16deg)}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:radial-gradient(circle at 30% 28%,#b9a8ff,#4a2fb8)!important;box-shadow:0 0 26px rgba(120,90,255,.5)}\n & .avatar-letter{color:#fff!important}\n & .bubble-outgoing,& .chat-send-btn{background:linear-gradient(135deg,#7b6bff,#b45cff)!important;color:#fff!important}\n & .p.star{background:#fff;border-radius:50%}}\n\n/* 9. ЛЕС — ночь, луна, ели, светлячки */\nhtml.v-st.v-forest{--bg:#06100c;--fg:#e4f3df;--mute:#7fa08a;--line:rgba(160,230,180,.16);--glass:rgba(8,22,16,.5);--g1:rgba(30,120,80,.3);--g2:rgba(10,70,60,.3);--serif:'Cormorant Garamond',serif\n & .page-bg{background:radial-gradient(circle 9vmin at 82% 16%,#f4f1c8 0 99%,transparent 100%),radial-gradient(circle 26vmin at 82% 16%,rgba(244,241,200,.18),transparent 70%),radial-gradient(70vw 40vw at 50% 110%,rgba(40,140,90,.35),transparent 70%),linear-gradient(180deg,#06100c,#0a2118)!important}\n & .soul-rings i{display:none}\n & .page-bg::before{inset:auto 0 0 0;height:40vh;background:linear-gradient(to top,rgba(120,200,160,.14),transparent);-webkit-mask-image:none;mask-image:none}\n & .soul-rings::before,& .soul-rings::after{content:\"\";position:absolute;left:0;right:0;bottom:0;background:#030906;clip-path:polygon(0 100%,0 60%,3% 20%,6% 60%,8% 55%,11% 8%,14% 55%,17% 62%,20% 25%,23% 62%,26% 50%,29% 12%,32% 50%,36% 58%,39% 22%,42% 58%,46% 50%,49% 5%,52% 50%,55% 60%,58% 28%,61% 60%,65% 52%,68% 15%,71% 52%,75% 60%,78% 24%,81% 60%,84% 50%,87% 10%,90% 50%,93% 58%,96% 26%,100% 60%,100% 100%);height:24vh}\n & .soul-rings::after{height:32vh;background:#0a1f16;transform:scaleX(-1);z-index:-1;opacity:.8}\n & .avatar-dynamic,& .chat-avatar,& .contact-avatar{background:linear-gradient(135deg,#b7e4a8,#3a8a5c)!important}\n & .avatar-letter{color:#06100c!important}\n & .bubble-outgoing,& .chat-send-btn{background:#8fd9a0!important;color:#06130c!important}\n & .p{border-radius:50%;background:#e8ff9a;box-shadow:0 0 10px 3px rgba(220,255,140,.7)}}\n<\/style>\n  <\/head>\n  <body class=\"h-full utgoing,& .chat-send-btn{background:#8fd9a0!important;color:#06130c!important}\n & .p{border-radius:50%;background:#e8ff9a;box-shadow:0 0 10px 3px rgba(220,255,140,.7)}}\n<\/style>\n  <\/head>\n  <body class=\"h-full text-white\">\n    <div class=\"min-h-screen page-bg text-white flex items-center justify-center px-3\">\n      <main\n        class=\"panel-enter settings-panel-glass w-full max-w-2xl mx-auto rounded-[28px] bg-black/70 border border-white/10 shadow-2xl p-6 transform scale-[1.20] relative overflow-hidden\"\n      >\n        <header class=\"flex items-center justify-between mb-6 relative z-10\">\n          <div class=\"flex items-center gap-4\">\n            <a\n              href=\"profile.html\"\n              class=\"avatar-dynamic w-16 h-16 rounded-full border flex items-center justify-center transition-transform duration-220 ease-out hover:scale-[1.08] hover:border-white/50\"\n            >\n              <span class=\"avatar-letter text-[20px] font-semibold tracking-tight\">\n                П\n              <\/span>\n            <\/a>\n            <div class=\"flex flex-col\">\n              <span class=\"text-[16px] font-semibold tracking-tight\">\n                пользователь\n              <\/span>\n              <span id=\"settings-user-handle\" class=\"text-[12px] text-neutral-400\">\n                @soul\n              <\/span>\n              <span class=\"mt-1 text-[10px] text-neutral-500\">\n                настройки mysocial.soul\n              <\/span>\n            <\/div>\n          <\/div>\n          <div class=\"flex flex-col items-end text-[11px] text-neutral-400\">\n            <span>mysocial.soul<\/span>\n            <span\n              class=\"badge-chip mt-1 px-2 py-1 rounded-full bg-white/5 border border-white/10 text-[10px]\"\n            >\n              настройки\n            <\/span>\n          <\/div>\n        <\/header>\n\n        <!-- профиль -->\n        <section class=\"mb-3 relative z-10\">\n          <a\n            href=\"profile.html\"\n            class=\"settings-card settings-cloud is-link cloud-hover block bg-gradient-to-r from-neutral-900 via-neutral-800 to-black border border-white/10 backdrop-blur-sm px-4 py-3 transition-transform transition-shadow duration-220 ease-out hover:scale-[1.02] hover:shadow-[0_0_40px_rgba(255,255,255,0.18)] no-underline text-inherit\"\n          >\n            <div class=\"settings-item\">\n              <div class=\"settings-item-main\">\n                <span class=\"settings-item-title text-neutral-200\">\n                  профиль и аккаунт\n                <\/span>\n                <span class=\"settings-item-sub text-neutral-500\">\n                  имя, @юзернейм, описание — всё, что связано с тобой\n                <\/span>\n              <\/div>\n              <svg class=\"settings-chevron\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                <path d=\"M6 9l6 6 6-6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n              <\/svg>\n            <\/div>\n          <\/a>\n        <\/section>\n\n        <!-- уведомления -->\n        <section class=\"mb-3 relative z-10\">\n          <div\n            class=\"settings-card settings-cloud cloud-hover bg-gradient-to-r from-neutral-900 via-neutral-800 to-black border border-white/10 backdrop-blur-sm px-4 py-3 transition-transform transition-shadow duration-220 ease-out hover:scale-[1.02] hover:shadow-[0_0_40px_rgba(255,255,255,0.18)]\"\n            data-section=\"notifications\"\n          >\n            <div class=\"settings-item\">\n              <div class=\"settings-item-main\">\n                <span class=\"settings-item-title text-neutral-200\">уведомления<\/span>\n                <span class=\"settings-item-sub text-neutral-500\">\n                  звуки, баннеры и превью сообщений\n                <\/span>\n              <\/div>\n              <svg class=\"settings-chevron\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                <path d=\"M6 9l6 6 6-6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n              <\/svg>\n            <\/div>\n            <div class=\"settings-expand\">\n              <div class=\"settings-expand-inner\">\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">звук<\/div>\n                    <div class=\"settings-row-hint\">сигнал при новом сообщении<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"notifSound\" aria-label=\"звук\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">баннеры<\/div>\n                    <div class=\"settings-row-hint\">всплывающие уведомления<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"notifBanner\" aria-label=\"баннеры\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">превью текста<\/div>\n                    <div class=\"settings-row-hint\">показывать содержимое в уведомлении<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"notifPreview\" aria-label=\"превью\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <!-- внешний вид -->\n        <section class=\"mb-3 relative z-10\">\n          <div\n            class=\"settings-card settings-cloud cloud-hover bg-gradient-to-r from-neutral-900 via-neutral-800 to-black border border-white/10 backdrop-blur-sm px-4 py-3 transition-transform transition-shadow duration-220 ease-out hover:scale-[1.02] hover:shadow-[0_0_40px_rgba(255,255,255,0.18)]\"\n            data-section=\"appearance\"\n          >\n            <div class=\"settings-item\">\n              <div class=\"settings-item-main\">\n                <span class=\"settings-item-title text-neutral-200\">внешний вид<\/span>\n                <span class=\"settings-item-sub text-neutral-500\">\n                  тема и стиль облаков сообщений\n                <\/span>\n              <\/div>\n              <svg class=\"settings-chevron\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                <path d=\"M6 9l6 6 6-6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n              <\/svg>\n            <\/div>\n            <div class=\"settings-expand\">\n              <div class=\"settings-expand-inner\">\n                <div class=\"settings-row\" style=\"border-top: none; padding-top: 4px;\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">тема<\/div>\n                    <div class=\"settings-row-hint\">тёмная или светлая<\/div>\n                  <\/div>\n                <\/div>\n                <div class=\"theme-pill-row\">\n                  <button type=\"button\" class=\"theme-pill\" data-theme=\"dark\">тёмная<\/button>\n                  <button type=\"button\" class=\"theme-pill\" data-theme=\"light\">светлая<\/button>\n                <\/div>\n\n                <div class=\"settings-row mt-2\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">облака сообщений<\/div>\n                    <div class=\"settings-row-hint\">как будут выглядеть пузыри в чате<\/div>\n                  <\/div>\n                <\/div>\n                <div id=\"bubble-preview\" class=\"bubble-preview-area\">\n                  <div class=\"bubble-row incoming\">\n                    <div class=\"bubble bubble-incoming\">привет, как дела?<\/div>\n                  <\/div>\n                  <div class=\"bubble-row outgoing\">\n                    <div class=\"bubble bubble-outgoing\">отлично, спасибо ✦<\/div>\n                  <\/div>\n                <\/div>\n                <div class=\"bubble-style-picker\">\n                  <button type=\"button\" class=\"bubble-style-btn is-active\" data-bubble-style=\"ios\">как на iphone<\/button>\n                  <button type=\"button\" class=\"bubble-style-btn\" data-bubble-style=\"soft\">мягкие<\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <!-- приватность -->\n        <section class=\"mb-3 relative z-10\">\n          <div\n            class=\"settings-card settings-cloud cloud-hover bg-gradient-to-r from-neutral-900 via-neutral-800 to-black border border-white/10 backdrop-blur-sm px-4 py-3 transition-transform transition-shadow duration-220 ease-out hover:scale-[1.02] hover:shadow-[0_0_40px_rgba(255,255,255,0.18)]\"\n            data-section=\"privacy\"\n          >\n            <div class=\"settings-item\">\n              <div class=\"settings-item-main\">\n                <span class=\"settings-item-title text-neutral-200\">конфиденциальность<\/span>\n                <span class=\"settings-item-sub text-neutral-500\">\n                  кто видит тебя онлайн и кто может писать первым\n                <\/span>\n              <\/div>\n              <svg class=\"settings-chevron\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                <path d=\"M6 9l6 6 6-6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n              <\/svg>\n            <\/div>\n            <div class=\"settings-expand\">\n              <div class=\"settings-expand-inner\">\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">статус «в сети»<\/div>\n                    <div class=\"settings-row-hint\">другие видят, что ты онлайн<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"showOnline\" aria-label=\"статус в сети\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">был(а) недавно<\/div>\n                    <div class=\"settings-row-hint\">показывать время последнего визита<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"showLastSeen\" aria-label=\"был недавно\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">сообщения от всех<\/div>\n                    <div class=\"settings-row-hint\">любой может написать тебе первым<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"allowMessages\" aria-label=\"сообщения от всех\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">прочитано<\/div>\n                    <div class=\"settings-row-hint\">показывать, что ты прочитал сообщение<\/div>\n                  <\/div>\n                  <button type=\"button\" class=\"ios-toggle\" data-setting=\"readReceipts\" aria-label=\"прочитано\">\n                    <span class=\"ios-toggle-knob\"><\/span>\n                  <\/button>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <!-- прочее -->\n        <section class=\"mb-6 relative z-10\">\n          <div\n            class=\"settings-card settings-cloud cloud-hover bg-gradient-to-r from-neutral-900 via-neutral-800 to-black border border-white/10 backdrop-blur-sm px-4 py-3 transition-transform transition-shadow duration-220 ease-out hover:scale-[1.02] hover:shadow-[0_0_40px_rgba(255,255,255,0.18)]\"\n            data-section=\"other\"\n          >\n            <div class=\"settings-item\">\n              <div class=\"settings-item-main\">\n                <span class=\"settings-item-title text-neutral-200\">прочее<\/span>\n                <span class=\"settings-item-sub text-neutral-500\">\n                  язык и маленькие детали\n                <\/span>\n              <\/div>\n              <svg class=\"settings-chevron\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\n                <path d=\"M6 9l6 6 6-6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" />\n              <\/svg>\n            <\/div>\n            <div class=\"settings-expand\">\n              <div class=\"settings-expand-inner\">\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">язык интерфейса<\/div>\n                    <div class=\"settings-row-hint\">можно сменить позже<\/div>\n                  <\/div>\n                  <span class=\"text-[11px] text-neutral-500\">русский<\/span>\n                <\/div>\n                <div class=\"settings-row\">\n                  <div>\n                    <div class=\"settings-row-label text-neutral-200\">версия<\/div>\n                    <div class=\"settings-row-hint\">mysocial.soul beta<\/div>\n                  <\/div>\n                  <span class=\"text-[11px] text-neutral-500\">0.1<\/span>\n                <\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/section>\n\n        <footer\n          class=\"mt-4 pt-4 border-t border-white/8 flex items-center justify-between text-[11px] text-neutral-500 relative z-10\"\n        >\n          <a href=\"index.html\" class=\"underline underline-offset-2\">\n            вернуться к чатам\n          <\/a>\n          <span>mysocial.soul<\/span>\n        <\/footer>\n      <\/main>\n    <\/div>\n\n    <script>\n      const SETTING_DEFAULTS = {\n        notifSound: true,\n        notifBanner: true,\n        notifPreview: true,\n        showOnline: true,\n        showLastSeen: true,\n        allowMessages: true,\n        readReceipts: true,\n      };\n\n      function getPastelColorFromInitial(ch) {\n        if (!ch) return '#9fb5ff';\n        const letter = ch.toUpperCase();\n        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n        const idx = letters.indexOf(letter);\n        const pastelPalette = [\n          '#ffd1dc', '#ffe4b5', '#c8e7ff', '#d7ffd9', '#f6e5ff', '#ffdfba',\n          '#fdd7ff', '#e3ffe7', '#ffe9e3', '#e0f0ff', '#fbe4ff', '#f7ffd1',\n          '#d1f7ff', '#ffe3f0', '#e6f5ff', '#e8ffe3', '#ffe8d6', '#e4e9ff',\n          '#ffeef5', '#e2fffb', '#fdf5e6', '#e5f0ff', '#f0ffe5', '#ffe5ff',\n          '#e5f7ff', '#f5ffe5'\n        ];\n        return idx >= 0 ? pastelPalette[idx] : '#e3edff';\n      }\n\n      function applyAvatarColorFromLetter() {\n        document.querySelectorAll('.avatar-dynamic').forEach((el) => {\n          const letterSpan = el.querySelector('.avatar-letter');\n          const ch = letterSpan ? letterSpan.textContent.trim().charAt(0) : '';\n          const base = getPastelColorFromInitial(ch);\n          el.style.backgroundImage = `linear-gradient(to bottom right, ${base}, #020617)`;\n          el.style.borderColor = `${base}80`;\n        });\n      }\n\n      function loadSetting(key) {\n        try {\n          const raw = localStorage.getItem('setting_' + key);\n          if (raw === null) return SETTING_DEFAULTS[key];\n          return raw === 'true';\n        } catch (e) {\n          return SETTING_DEFAULTS[key];\n        }\n      }\n\n      function saveSetting(key, value) {\n        try {\n          localStorage.setItem('setting_' + key, value ? 'true' : 'false');\n        } catch (e) {}\n      }\n\n      function setTheme(theme) {\n        const html = document.documentElement;\n        html.classList.remove('theme-light', 'theme-dark');\n        html.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark');\n        localStorage.setItem('theme', theme);\n\n        document.querySelectorAll('.theme-pill').forEach((pill) => {\n          pill.classList.toggle('is-active', pill.dataset.theme === theme);\n        });\n      }\n\n      function initToggles() {\n        document.querySelectorAll('.ios-toggle[data-setting]').forEach((toggle) => {\n          const key = toggle.dataset.setting;\n          const isOn = loadSetting(key);\n          toggle.classList.toggle('is-on', isOn);\n          toggle.setAttribute('aria-pressed', isOn ? 'true' : 'false');\n\n          toggle.addEventListener('click', (e) => {\n            e.stopPropagation();\n            const next = !toggle.classList.contains('is-on');\n            toggle.classList.toggle('is-on', next);\n            toggle.setAttribute('aria-pressed', next ? 'true' : 'false');\n            saveSetting(key, next);\n          });\n        });\n      }\n\n      function initExpandableSections() {\n        document.querySelectorAll('.settings-card[data-section]').forEach((card) => {\n          card.addEventListener('click', (e) => {\n            if (e.target.closest('.ios-toggle, .theme-pill, .bubble-style-btn')) return;\n\n            const isOpen = card.classList.contains('is-open');\n            document.querySelectorAll('.settings-card.is-open').forEach((openCard) => {\n              if (openCard !== card) openCard.classList.remove('is-open');\n            });\n            card.classList.toggle('is-open', !isOpen);\n\n            try {\n              localStorage.setItem('settingsOpenSection', !isOpen ? card.dataset.section : '');\n            } catch (err) {}\n          });\n        });\n\n        try {\n          const openSection = localStorage.getItem('settingsOpenSection');\n          if (openSection) {\n            const card = document.querySelector(`[data-section=\"${openSection}\"]`);\n            if (card) card.classList.add('is-open');\n          }\n        } catch (e) {}\n      }\n\n      function initThemePills() {\n        const saved = localStorage.getItem('theme') || 'dark';\n        setTheme(saved);\n\n        document.querySelectorAll('.theme-pill').forEach((pill) => {\n          pill.addEventListener('click', (e) => {\n            e.stopPropagation();\n            setTheme(pill.dataset.theme);\n          });\n        });\n      }\n\n      function initBubbleStyle() {\n        const preview = document.getElementById('bubble-preview');\n        const buttons = document.querySelectorAll('.bubble-style-btn');\n        let style = 'ios';\n\n        try {\n          style = localStorage.getItem('bubbleStyle') || 'ios';\n        } catch (e) {}\n\n        function applyStyle(next) {\n          style = next;\n          preview.classList.remove('style-ios', 'style-soft');\n          preview.classList.add('style-' + next);\n          buttons.forEach((btn) => {\n            btn.classList.toggle('is-active', btn.dataset.bubbleStyle === next);\n          });\n          try {\n            localStorage.setItem('bubbleStyle', next);\n          } catch (e) {}\n        }\n\n        applyStyle(style);\n\n        buttons.forEach((btn) => {\n          btn.addEventListener('click', (e) => {\n            e.stopPropagation();\n            applyStyle(btn.dataset.bubbleStyle);\n          });\n        });\n      }\n\n      function applyHomeHandle() {\n
